name: TV guide v2
on:
 schedule:
 - cron: "17 1,13 * * *"
 workflow_dispatch:
permissions:
 contents: write
jobs:
 guide:
  runs-on: ubuntu-latest
  timeout-minutes: 330
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-node@v4
    with:
     node-version: 22
  - run: |
     git clone --depth 1 https://github.com/iptv-org/epg.git grabber
     cd grabber && npm install --no-audit --no-fund || true
     mkdir -p temp/data && cd temp/data
     for f in blocklist categories channels cities countries feeds guides languages logos regions streams subdivisions timezones; do [ -s $f.json ] || curl -sfLO https://raw.githubusercontent.com/iptv-org/api/gh-pages/$f.json; done
