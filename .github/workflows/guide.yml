          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "qanawati"}), timeout=120).read().decode("utf-8", "ignore")
          def items(text):
              L = text.splitlines()
              for i, l in enumerate(L):
                  if l.startswith("#EXTINF"):
                      g = re.search(r'group-title="([^"]*)"', l); t = re.search(r'tvg-id="([^"]*)"', l)
                      yield (t.group(1) if t else ""), (g.group(1) if g else ""), l.rsplit(",", 1)[-1]
          want = {}  # base id -> (lang, name)
          for tid, grp, name in items(get("https://raw.githubusercontent.com/iptv-org/iptv/gh-pages/index.language.m3u")):
              lang = {"Arabic": "ar", "English": "en"}.get(grp)
              if not lang or not tid or (lang == "en" and "Geo-blocked" in name):
                  continue
              want.setdefault(tid.split("@")[0].lower(), (lang, re.sub(r"\s*[\(\[].*", "", name).strip()))
