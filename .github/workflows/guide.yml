name: Build TV guide

on:
  schedule:
    - cron: "17 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get the iptv-org grabber
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git grabber
          cd grabber && npm install --no-audit --no-fund

      - name: Build the channel list
        run: |
