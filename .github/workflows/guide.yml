          for tid, grp, name in items(get("https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8")):
              if tid and grp in AR_G:
                  want.setdefault(tid.split("@")[0].lower(), ("ar", re.sub(r"[ⓈⒼⓎⓉ]", "", name).strip()))
          gm, es = {}, {}
          def norm(s):
              s = re.sub(r"\(.*?\)|\[.*?\]", "", s.lower())
              s = re.sub(r"\b(tv|hd|sd|fhd|uhd|channel|television|live|the|al)\b", " ", s)
              return re.sub(r"[^a-z0-9]", "", s)
