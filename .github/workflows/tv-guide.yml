name: TV guide

on:
  schedule:
    - cron: "17 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get the iptv-org grabber
        run: |
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git grabber
          cd grabber && npm install --no-audit --no-fund || true
          mkdir -p temp/data
          for f in blocklist categories channels cities countries feeds guides languages logos regions streams subdivisions timezones; do
            [ -s temp/data/$f.json ] || curl -sfL -o temp/data/$f.json https://raw.githubusercontent.com/iptv-org/api/gh-pages/$f.json
          done
      - name: Unpack our scripts (build.py, grab.sh, compact.py)
        run: echo "" | base64 -d | tar xz
      - name: Build the channel lists
        run: python3 build.py
      - name: Grab two days of listings, one site at a time
        run: bash grab.sh
      - name: Make the compact file for the TV
        run: python3 compact.py
      - name: Publish
        run: |
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add guide.tsv.gz guide-stats.txt
          git commit -m "Guide $(date -u +%Y-%m-%dT%H:%M)" || echo "no change"
          git push
